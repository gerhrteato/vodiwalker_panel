<!doctype html><html lang="fa" dir="rtl" translate="no" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="google" content="notranslate"><title>VodiWalker Admin</title>
<link rel="stylesheet" href="/assets/ui.css"><script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#080b14;--p:#0f1420;--p2:#141a2b;--ln:#212a40;--a:#9b5cff;--b:#37d6ff;--ok:#22c58b;--bad:#f24955;--w:#f5a524;--t:#eef1fb;--s:#8b95b3}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:radial-gradient(60% 26% at 85% -4%,rgba(155,92,255,.22),transparent 70%),var(--bg);color:var(--t);font-family:Vazirmatn,Tahoma,sans-serif;min-height:100dvh;line-height:1.7;padding-bottom:calc(30px + env(safe-area-inset-bottom,0))}
.top{position:sticky;top:0;z-index:5;background:var(--p);border-bottom:1px solid var(--ln);padding:calc(8px + env(safe-area-inset-top,0)) 12px 8px}.hd{display:flex;align-items:center;gap:10px}.lg{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-size:19px;background:linear-gradient(135deg,var(--a),var(--b))}.hd b{flex:1;font-size:15px}.hd small{display:block;font-size:10px;color:var(--s);font-weight:500}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-top:8px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.tabs a{flex:none;padding:7px 13px;border-radius:99px;font-size:12px;font-weight:700;color:var(--s);background:var(--p2);border:1px solid var(--ln)}.tabs a.on{color:#fff;background:var(--a);border-color:var(--a)}
.w{padding:12px}.card{background:var(--p);border:1px solid var(--ln);border-radius:14px;padding:14px;margin-bottom:10px}.sg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}.sg .card{margin:0}.sg b{font-size:22px;display:block;direction:ltr;text-align:right}.sg small{color:var(--s);font-size:11px}
h2{font-size:13px;color:var(--s);margin:16px 2px 8px}button{font:700 12.5px Vazirmatn,Tahoma,sans-serif;display:inline-flex;gap:6px;align-items:center;justify-content:center;border-radius:10px;border:1px solid var(--ln);background:var(--p2);color:var(--t);padding:9px 13px;cursor:pointer}button:active{transform:scale(.97)}.pr{background:var(--a);border-color:var(--a);color:#fff}.dg{color:var(--bad);border-color:rgba(242,73,85,.35)}.wide{width:100%}
.row{display:flex;align-items:center;gap:10px;padding:11px 12px;background:var(--p);border:1px solid var(--ln);border-radius:13px;margin-bottom:8px}.row .m{flex:1;min-width:0}.row b{font-size:13px;display:block}.row small{color:var(--s);font-size:11px}.row .ic{display:flex;gap:6px}.row .ic button{padding:7px 9px}
.on-dot{color:var(--ok)}.off-dot{color:var(--bad)}.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}.chips button{padding:6px 11px;font-size:12px}
label{display:block;font-size:12px;color:var(--s);margin:8px 0 4px}input,select,textarea{width:100%;background:var(--p2);border:1px solid var(--ln);color:var(--t);border-radius:10px;padding:10px;font:16px Vazirmatn,sans-serif;outline:0}input:focus,textarea:focus{border-color:var(--a)}textarea{min-height:90px;resize:vertical}.ck{display:flex;align-items:center;gap:10px;margin-top:10px}.ck input{width:22px;height:22px}
.sheet{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.6);display:flex;align-items:flex-end}.sheet>div{width:100%;max-height:88dvh;overflow:auto;background:var(--p);border-radius:20px 20px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom,0));border-top:1px solid var(--a)}.sheet h4{margin:0 0 6px;font-size:15px}
#t{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:#fff;color:#111;padding:9px 18px;border-radius:12px;font-size:13px;font-weight:700;z-index:30;display:none}
</style></head><body>
<div class="top"><div class="hd"><div class="lg">🛠</div><b>مرکز مدیریت فروش<small>VodiWalker Admin</small></b><button onclick="location.href='/app'"><i class="ti ti-server"></i>کانفیگ‌ها</button><button onclick="location.href='/tma/shop'"><i class="ti ti-eye"></i>مشتری</button></div><div class="tabs" id="tb"></div></div>
<div class="w" id="v"></div><div id="sh"></div><div id="t"></div>
<script>
var W=window.Telegram&&Telegram.WebApp,S={tab:'d',d:null,users:[]},$=function(i){return document.getElementById(i)};if(W){W.ready();W.expand()}
function api(a,b){return fetch('/api/shop/admin/'+a,{method:'POST',headers:{'Content-Type':'application/json','X-TG-Init':W?W.initData:''},body:JSON.stringify(b||{})}).then(function(r){return r.json().then(function(j){if(!r.ok)throw Error(j.detail||'خطا');return j})})}
function toast(m){var t=$('t');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(function(){t.style.display='none'},2400)}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function load(){return api('state').then(function(d){S.d=d;draw()}).catch(function(e){$('v').innerHTML='<div class="card">'+esc(e.message)+'</div>'})}
function act(a,b,msg){return api(a,b).then(function(r){toast(msg||'ذخیره شد ✓');return load().then(function(){return r})}).catch(function(e){toast(e.message)})}
// فرم عمومی (باتم‌شیت): fields=[{k,l,t,v,o}]
function sheet(title,fields,save,extra){var h='<div class="sheet" onclick="if(event.target==this)this.remove()"><div><h4>'+title+'</h4>'+fields.map(function(f){var id='f_'+f.k,v=f.v==null?'':f.v;
 if(f.t=='check')return'<div class="ck"><input type="checkbox" id="'+id+'"'+(v?' checked':'')+'><span>'+f.l+'</span></div>';
 if(f.t=='select')return'<label>'+f.l+'</label><select id="'+id+'">'+f.o.map(function(o){return'<option value="'+o[0]+'"'+(o[0]==v?' selected':'')+'>'+o[1]+'</option>'}).join('')+'</select>';
 if(f.t=='area')return'<label>'+f.l+'</label><textarea id="'+id+'">'+esc(v)+'</textarea>';
 return'<label>'+f.l+'</label><input id="'+id+'" type="'+(f.t||'text')+'" '+(f.t=='number'?'step="any" inputmode="decimal" ':'')+'value="'+esc(v)+'">'}).join('')+'<div style="display:flex;gap:8px;margin-top:14px"><button class="pr" style="flex:1" id="sv">ذخیره</button><button onclick="document.querySelector(\'.sheet\').remove()">انصراف</button></div></div></div>';
 $('sh').innerHTML=h;$('sv').onclick=function(){var o={};fields.forEach(function(f){var e=$('f_'+f.k);o[f.k]=f.t=='check'?e.checked:e.value});document.querySelector('.sheet').remove();save(o)}}
var TABS=[['d','📊 داشبورد'],['t','🎁 تست رایگان'],['p','🛒 پلن‌ها'],['b','🔘 دکمه‌ها'],['u','👥 کاربران'],['x','✍️ متن‌ها']];
function draw(){$('tb').innerHTML=TABS.map(function(t){return'<a class="'+(S.tab==t[0]?'on':'')+'" onclick="S.tab=\''+t[0]+'\';draw()">'+t[1]+'</a>'}).join('');var d=S.d;if(!d)return;$('v').innerHTML={d:dash,t:trial,p:plans,b:btns,u:users,x:texts}[S.tab](d);if(S.tab=='u'&&!S.users.length)findUsers('')}
function dash(d){var s=d.stats,pn={};d.plans.forEach(function(p){pn[p.id]=p.name});return'<div class="sg"><div class="card"><small>کاربران ربات</small><b>'+s.users+'</b></div><div class="card"><small>فروش‌ها</small><b>'+s.orders+'</b></div><div class="card"><small>درآمد ⭐</small><b>'+s.stars+'</b></div><div class="card"><small>تست‌های رایگان</small><b>'+s.trials+'</b></div></div><h2>آخرین سفارش‌ها</h2>'+(d.orders.length?d.orders.map(function(o){return'<div class="row"><div class="m"><b>'+esc(pn[o.plan_id]||o.plan_id)+' — ⭐'+o.amount_stars+'</b><small>@'+esc(o.username||o.user_id)+' · '+String(o.created_at||'').replace('T',' ').slice(0,16)+'</small></div></div>'}).join(''):'<div class="card" style="color:var(--s)">هنوز سفارشی ثبت نشده.</div>')}
function trial(d){var t=d.trial;return'<div class="card"><b>🎁 تنظیمات تست رایگان</b><p style="color:var(--s);font-size:12px;margin:4px 0 10px">وضعیت: <b class="'+(t.enabled?'on-dot':'off-dot')+'">'+(t.enabled?'فعال':'غیرفعال')+'</b> — هر کاربر '+(t.per_user||'نامحدود')+' بار. حجم فعلی: <b>'+t.gb+' GB</b> / '+t.days+' روز</p><div class="chips">'+[0.5,1,2,5].map(function(g){return'<button onclick="quick('+g+')">'+g+' GB</button>'}).join('')+'</div><button class="pr wide" onclick="editTrial()"><i class="ti ti-adjustments"></i>ویرایش کامل تنظیمات</button></div>'}
function quick(g){var t=S.d.trial;act('trial',Object.assign({},t,{gb:g}),'حجم تست '+g+' گیگ شد ✓')}
function editTrial(){var t=S.d.trial;sheet('تنظیمات تست رایگان',[{k:'enabled',l:'تست رایگان فعال باشد',t:'check',v:t.enabled},{k:'gb',l:'حجم (گیگابایت — مثلاً 0.5 یا 3)',t:'number',v:t.gb},{k:'days',l:'مدت اعتبار (روز)',t:'number',v:t.days},{k:'speed_mbps',l:'محدودیت سرعت (Mbps — 0 = نامحدود)',t:'number',v:t.speed_mbps},{k:'ip_limit',l:'تعداد دستگاه (0 = نامحدود)',t:'number',v:t.ip_limit},{k:'per_user',l:'سقف دفعات برای هر کاربر (0 = نامحدود)',t:'number',v:t.per_user},{k:'channel',l:'کانال اجباری (اختیاری، مثل @mychannel — ربات باید ادمین کانال باشد)',v:t.channel}],function(o){act('trial',o)})}
function plans(d){return'<button class="pr wide" style="margin-bottom:10px" onclick="editPlan()"><i class="ti ti-plus"></i>پلن جدید</button>'+d.plans.map(function(p,i){return'<div class="row"><div class="m"><b>'+esc(p.name)+(p.featured?' ⭐':'')+' — ⭐'+p.stars+'</b><small>'+p.days+' روز · '+p.volume_gb+'GB · '+(p.speed_mbps||'∞')+'Mbps · '+(p.ip_limit||'∞')+' دستگاه'+(p.badge?' · '+esc(p.badge):'')+'</small></div><div class="ic"><button onclick="editPlan('+i+')"><i class="ti ti-edit"></i></button><button class="dg" onclick="if(confirm(\'حذف پلن؟\'))act(\'plan_del\',{id:S.d.plans['+i+'].id},\'حذف شد\')"><i class="ti ti-trash"></i></button></div></div>'}).join('')}
function editPlan(i){var p=i==null?{days:30,volume_gb:50,speed_mbps:0,ip_limit:1,stars:100}:S.d.plans[i];sheet(i==null?'پلن جدید':'ویرایش پلن',[{k:'name',l:'نام پلن',v:p.name},{k:'stars',l:'قیمت (Stars)',t:'number',v:p.stars},{k:'days',l:'مدت (روز)',t:'number',v:p.days},{k:'volume_gb',l:'حجم (GB)',t:'number',v:p.volume_gb},{k:'speed_mbps',l:'سرعت (Mbps — 0 = نامحدود)',t:'number',v:p.speed_mbps},{k:'ip_limit',l:'تعداد دستگاه (0 = نامحدود)',t:'number',v:p.ip_limit},{k:'badge',l:'برچسب (مثلاً پیشنهاد ویژه)',v:p.badge},{k:'featured',l:'پلن ویژه (هایلایت شود)',t:'check',v:p.featured}],function(o){o.id=p.id;act('plan_save',o)})}
function btns(d){return'<button class="pr wide" style="margin-bottom:10px" onclick="editBtn()"><i class="ti ti-plus"></i>دکمه‌ی جدید</button><p style="color:var(--s);font-size:12px;margin:0 2px 10px">این دکمه‌ها هم در ربات و هم در مینی‌اپ مشتری نمایش داده می‌شوند (نوع «پیام متنی» فقط در ربات).</p>'+d.buttons.map(function(b,i){var T={url:'لینک',webapp:'مینی‌اپ',text:'پیام متنی'};return'<div class="row"><div class="m"><b class="'+(b.enabled?'':'off-dot')+'">'+esc(b.text)+'</b><small>'+T[b.type]+' · '+esc(b.value).slice(0,38)+'</small></div><div class="ic"><button onclick="act(\'btn_move\',{id:\''+b.id+'\',dir:\'up\'},\'جابه‌جا شد\')"><i class="ti ti-arrow-up"></i></button><button onclick="act(\'btn_move\',{id:\''+b.id+'\',dir:\'down\'},\'جابه‌جا شد\')"><i class="ti ti-arrow-down"></i></button><button onclick="editBtn('+i+')"><i class="ti ti-edit"></i></button><button class="dg" onclick="act(\'btn_del\',{id:\''+b.id+'\'},\'حذف شد\')"><i class="ti ti-trash"></i></button></div></div>'}).join('')}
function editBtn(i){var b=i==null?{type:'url',enabled:true}:S.d.buttons[i];sheet(i==null?'دکمه‌ی جدید':'ویرایش دکمه',[{k:'text',l:'متن دکمه',v:b.text},{k:'type',l:'نوع',t:'select',v:b.type,o:[['url','لینک (https)'],['webapp','مینی‌اپ (https)'],['text','پیام متنی در ربات']]},{k:'value',l:'مقدار (آدرس یا متن پیام)',t:'area',v:b.value},{k:'enabled',l:'فعال باشد',t:'check',v:b.enabled}],function(o){o.id=b.id;o.order=b.order;act('btn_save',o)})}
function users(d){return'<div class="card"><input id="q" placeholder="جستجو: آیدی عددی / یوزرنیم / نام" oninput="clearTimeout(S.h);S.h=setTimeout(function(){findUsers($(\'q\').value)},350)"></div><div id="ul"></div><h2>پیام همگانی</h2><div class="card"><textarea id="bc" placeholder="متن پیام (HTML ساده مجاز)…"></textarea><button class="pr wide" style="margin-top:8px" onclick="bcast()"><i class="ti ti-send"></i>ارسال به همه</button></div>'}
function findUsers(q){api('users',{q:q}).then(function(r){S.users=r.users;var e=$('ul');if(e)e.innerHTML=r.users.length?r.users.map(function(u,i){return'<div class="row"><div class="m"><b>'+esc(u.name||'—')+(u.username?' @'+esc(u.username):'')+'</b><small>'+u.id+' · '+u.configs+' سرویس · '+u.trials+' تست'+(u.banned?' · 🚫 مسدود':'')+'</small></div><div class="ic"><button class="'+(u.banned?'':'dg')+'" onclick="ban(\''+u.id+'\')">'+(u.banned?'رفع مسدودی':'مسدود')+'</button></div></div>'}).join(''):'<div class="card" style="color:var(--s)">کاربری پیدا نشد.</div>'})}
function ban(id){api('ban',{id:id}).then(function(){toast('انجام شد ✓');findUsers($('q').value)}).catch(function(e){toast(e.message)})}
function bcast(){var t=$('bc').value.trim();if(!t)return toast('متن خالی است');if(!confirm('ارسال برای همه‌ی کاربران؟'))return;api('broadcast',{text:t}).then(function(r){toast('در صف ارسال: '+r.queued+' نفر');$('bc').value=''}).catch(function(e){toast(e.message)})}
function texts(d){var x=d.texts;return'<div class="card"><label>نام برند</label><input id="x0" value="'+esc(d.brand)+'"><label>پیام خوش‌آمد (/start)</label><textarea id="x1">'+esc(x.welcome)+'</textarea><label>پیام فعال‌سازی تست</label><textarea id="x2">'+esc(x.trial_ok)+'</textarea><label>پیام بعد از پرداخت</label><textarea id="x3">'+esc(x.paid_ok)+'</textarea><button class="pr wide" style="margin-top:12px" onclick="act(\'texts\',{brand:$(\'x0\').value,welcome:$(\'x1\').value,trial_ok:$(\'x2\').value,paid_ok:$(\'x3\').value})">ذخیره</button></div>'}
load()
</script></body></html>
