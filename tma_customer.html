<!doctype html><html lang="fa" dir="rtl" translate="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="google" content="notranslate"><title>VodiWalker</title>
<link rel="stylesheet" href="/assets/ui.css"><script src="https://telegram.org/js/telegram-web-app.js"></script><script src="/assets/qr.js"></script>
<style>
:root{--bg:#070a12;--p:#0f1523;--p2:#151d30;--ln:#222c45;--a:#9b5cff;--b:#37d6ff;--ok:#22c58b;--bad:#f24955;--t:#eef1fb;--s:#8b95b3}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:radial-gradient(70% 30% at 90% -5%,rgba(155,92,255,.28),transparent 70%),radial-gradient(60% 26% at 0 12%,rgba(55,214,255,.14),transparent 70%),var(--bg);color:var(--t);font-family:Vazirmatn,Tahoma,sans-serif;min-height:100dvh;padding:calc(12px + env(safe-area-inset-top,0)) 14px calc(86px + env(safe-area-inset-bottom,0));line-height:1.7}
.hd{display:flex;align-items:center;gap:10px;margin-bottom:14px}.lg{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-size:22px;background:linear-gradient(135deg,var(--a),var(--b))}.hd b{font-size:16px;display:block}.hd small{color:var(--s);font-size:11px}.hd .sp{flex:1}
button{font:700 13px Vazirmatn,Tahoma,sans-serif;border:0;border-radius:12px;padding:12px 16px;cursor:pointer;color:#fff;background:linear-gradient(135deg,var(--a),#6d4bff);display:inline-flex;gap:7px;align-items:center;justify-content:center}button:active{transform:scale(.97)}button.g{background:var(--p2);border:1px solid var(--ln);color:var(--t)}button:disabled{opacity:.5}
.tk{position:relative;border-radius:20px;padding:20px;background:linear-gradient(135deg,#2a1757,#0f3a52);border:1px solid rgba(155,92,255,.45);overflow:hidden;margin-bottom:16px}.tk:before,.tk:after{content:"";position:absolute;top:50%;width:22px;height:22px;border-radius:50%;background:var(--bg);margin-top:-11px}.tk:before{right:-11px}.tk:after{left:-11px}
.tk .big{font-size:44px;font-weight:900;line-height:1.1;direction:ltr;text-align:right}.tk .big span{font-size:18px;margin-inline-start:6px;color:var(--b)}.tk p{margin:6px 0 14px;color:#cdd6f6;font-size:13px}.tk button{width:100%;background:#fff;color:#1b1040}
h3{font-size:13px;color:var(--s);margin:18px 2px 10px}.sc{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}.sc::-webkit-scrollbar{display:none}
.pl{flex:0 0 190px;background:var(--p);border:1px solid var(--ln);border-radius:18px;padding:16px;position:relative}.pl.f{border-color:var(--a);box-shadow:0 0 0 1px var(--a),0 10px 30px rgba(155,92,255,.25)}.pl .bd{position:absolute;top:-10px;inset-inline-start:12px;background:var(--a);font-size:10px;padding:2px 10px;border-radius:99px;font-weight:700}
.pl b{font-size:16px}.pl .pr{font-size:26px;font-weight:900;margin:6px 0;direction:ltr;text-align:right}.pl ul{list-style:none;margin:0 0 12px;padding:0;font-size:12px;color:var(--s)}.pl li:before{content:"✓ ";color:var(--ok)}.pl button{width:100%}
.cd{background:var(--p);border:1px solid var(--ln);border-radius:16px;padding:14px;margin-bottom:10px}.cd .r{display:flex;justify-content:space-between;align-items:center;gap:8px}.dot{width:9px;height:9px;border-radius:50%;background:var(--ok);display:inline-block;margin-inline-end:6px}.dot.x{background:var(--bad)}
.bar{height:7px;border-radius:9px;background:var(--p2);margin:10px 0 6px;overflow:hidden}.bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--a),var(--b))}.mt{font-size:11px;color:var(--s);display:flex;justify-content:space-between}
.acts{display:flex;gap:8px;margin-top:10px}.acts button{flex:1;padding:9px 6px;font-size:12px}.qr{background:#fff;border-radius:12px;padding:10px;margin-top:10px;display:grid;place-items:center}
.gr{display:grid;grid-template-columns:1fr 1fr;gap:8px}.gr button{width:100%}.em{text-align:center;color:var(--s);padding:34px 10px}.em i{font-size:42px;display:block;color:var(--a)}
nav{position:fixed;bottom:0;inset-inline:0;display:flex;background:rgba(15,21,35,.92);backdrop-filter:blur(14px);border-top:1px solid var(--ln);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0))}nav a{flex:1;text-align:center;font-size:11px;color:var(--s);padding:6px;border-radius:12px}nav a i{display:block;font-size:21px}nav a.on{color:#fff;background:rgba(155,92,255,.18)}
#t{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:#fff;color:#111;padding:9px 18px;border-radius:12px;font-size:13px;font-weight:700;z-index:9;display:none;max-width:90%}
</style></head><body><div id="v"></div><nav id="n"></nav><div id="t"></div>
<script>
var W=window.Telegram&&Telegram.WebApp,S={tab:'h',d:null,qr:{}},$=function(i){return document.getElementById(i)};
if(W){W.ready();W.expand();try{W.setHeaderColor('#070a12');W.setBackgroundColor('#070a12')}catch(e){}}
function api(a,b){return fetch('/api/shop/'+a,{method:'POST',headers:{'Content-Type':'application/json','X-TG-Init':W?W.initData:''},body:JSON.stringify(b||{})}).then(function(r){return r.json().then(function(j){if(!r.ok)throw Error(j.detail||'خطا');return j})})}
function toast(m){var t=$('t');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(function(){t.style.display='none'},2600)}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function fb(n){if(!n)return'0';var u=['B','KB','MB','GB','TB'],i=0;while(n>=1024&&i<4){n/=1024;i++}return(n>=100||i<2?Math.round(n):n.toFixed(1))+' '+u[i]}
function qr(v){var q=qrcode(0,'M');q.addData(v);q.make();return q.createSvgTag(5,0)}
function cp(v){(navigator.clipboard?navigator.clipboard.writeText(v):Promise.reject()).then(function(){toast('کپی شد ✓')},function(){var x=document.createElement('textarea');x.value=v;document.body.appendChild(x);x.select();document.execCommand('copy');x.remove();toast('کپی شد ✓')})}
function go(u){W&&u.indexOf('t.me')>-1?W.openTelegramLink(u):(W?W.openLink(u):location.href=u)}
function nav(){var T=[['h','ti-home-2','خانه'],['m','ti-shield-bolt','سرویس‌ها'],['s','ti-headset','پشتیبانی']];$('n').innerHTML=T.map(function(x){return'<a class="'+(S.tab==x[0]?'on':'')+'" onclick="tab(\''+x[0]+'\')"><i class="ti '+x[1]+'"></i>'+x[2]+'</a>'}).join('')}
function tab(t){S.tab=t;draw()}
function head(d){return'<div class="hd"><div class="lg">🚀</div><div><b>'+esc(d.brand)+'</b><small>سلام '+esc(d.user.name)+' 👋</small></div><div class="sp"></div>'+(d.user.admin?'<button class="g" style="padding:8px 12px" onclick="location.href=\'/tma/admin\'"><i class="ti ti-settings"></i>ادمین</button>':'')+'</div>'}
function home(d){var t=d.trial,h=head(d);
 if(t.enabled)h+='<div class="tk"><div class="big">'+t.gb+'<span>GB رایگان</span></div><p>'+(t.used?'تست رایگان خودت رو قبلاً گرفتی. از پلن‌های زیر ادامه بده 👇':'بدون پرداخت امتحان کن؛ اعتبار '+t.days+' روزه، فعال‌سازی آنی.')+'</p><button '+(t.used?'disabled':'onclick="trial(this)"')+'><i class="ti ti-gift"></i>'+(t.used?'استفاده شده':'دریافت تست رایگان')+'</button></div>';
 h+='<h3>پلن‌های اشتراک</h3><div class="sc">'+d.plans.map(function(p){return'<div class="pl'+(p.featured?' f':'')+'">'+(p.badge?'<span class="bd">'+esc(p.badge)+'</span>':'')+'<b>'+esc(p.name)+'</b><div class="pr">⭐ '+p.stars+'</div><ul><li>'+p.days+' روز اعتبار</li><li>'+p.volume_gb+' گیگ حجم</li><li>'+(p.speed_mbps?p.speed_mbps+' Mbps سرعت':'سرعت نامحدود')+'</li><li>'+(p.ip_limit?p.ip_limit+' دستگاه':'دستگاه نامحدود')+'</li></ul><button onclick="buy(\''+p.id+'\',this)">خرید با Stars</button></div>'}).join('')+'</div>';
 if(d.buttons.length)h+='<h3>لینک‌های مفید</h3><div class="gr">'+d.buttons.map(function(b,i){return'<button class="g" onclick="go(S.d.buttons['+i+'].value)">'+esc(b.text)+'</button>'}).join('')+'</div>';
 return h}
function mine(d){var h=head(d);if(!d.mine.length)return h+'<div class="em"><i class="ti ti-plane-off"></i>هنوز سرویسی نداری<br><button style="margin-top:14px" onclick="tab(\'h\')">شروع کن</button></div>';
 return h+d.mine.map(function(c,i){var p=c.limit?Math.min(100,c.used/c.limit*100):0;return'<div class="cd"><div class="r"><b><span class="dot'+(c.active?'':' x')+'"></span>'+esc(c.label)+'</b><small style="color:var(--s)">'+(c.trial?'تست':'')+'</small></div><div class="bar"><i style="width:'+p+'%"></i></div><div class="mt"><span>'+fb(c.used)+' / '+(c.limit?fb(c.limit):'نامحدود')+'</span><span>'+(c.days==null?'بدون انقضا':c.days+' روز مانده')+'</span></div><div class="acts"><button onclick="cp(S.d.mine['+i+'].link)"><i class="ti ti-copy"></i>لینک</button><button class="g" onclick="cp(S.d.mine['+i+'].sub)"><i class="ti ti-link"></i>ساب</button><button class="g" onclick="S.qr['+i+']=!S.qr['+i+'];draw()"><i class="ti ti-qrcode"></i>QR</button></div>'+(S.qr[i]?'<div class="qr">'+qr(c.link)+'</div>':'')+'</div>'}).join('')}
function help(d){var sup=String(d.support||'').replace('@','');return head(d)+'<div class="cd"><b>راهنمای اتصال</b><p style="color:var(--s);font-size:13px;margin:6px 0 0">۱) از تب «سرویس‌ها» لینک ساب رو کپی کن.<br>۲) در v2rayNG / Streisand / Hiddify گزینه‌ی افزودن از کلیپ‌بورد رو بزن.<br>۳) متصل شو و لذت ببر.</p></div>'+(sup?'<button style="width:100%" onclick="go(\'https://t.me/'+esc(sup)+'\')"><i class="ti ti-brand-telegram"></i>گفتگو با پشتیبانی</button>':'')}
function draw(){nav();var d=S.d;if(!d)return;$('v').innerHTML=S.tab=='h'?home(d):S.tab=='m'?mine(d):help(d)}
function load(){return api('me').then(function(d){S.d=d;draw()}).catch(function(e){$('v').innerHTML='<div class="em"><i class="ti ti-lock"></i>'+esc(e.message)+'<br><small>این صفحه را از داخل ربات باز کنید.</small></div>'})}
function trial(b){b.disabled=true;api('trial').then(function(){toast('تست رایگان فعال شد 🎉');W&&W.HapticFeedback&&W.HapticFeedback.notificationOccurred('success');return load()}).then(function(){S.tab='m';draw()}).catch(function(e){toast(e.message);b.disabled=false})}
function buy(id,b){b.disabled=true;api('invoice',{plan:id}).then(function(r){if(!W)return toast('داخل تلگرام باز کن');W.openInvoice(r.link,function(s){b.disabled=false;if(s=='paid'){toast('پرداخت موفق ✓ در حال آماده‌سازی…');setTimeout(function(){load().then(function(){S.tab='m';draw()})},1800)}else if(s=='failed')toast('پرداخت ناموفق بود')})}).catch(function(e){toast(e.message);b.disabled=false})}
load()
</script></body></html>
