function bcast(){var t=$('bc').value.trim();if(!t)return toast('متن خالی است');if(!confirm('ارسال برای همه‌ی کاربران؟'))return;api('broadcast',{text:t}).then(function(r){toast('در صف ارسال: '+r.queued+' نفر');$('bc').value=''}).catch(function(e){toast(e.message)})}
function users(){return'<div class="gc card"><input id="q" placeholder="جستجو: آیدی عددی / یوزرنیم / نام" oninput="clearTimeout(S.h);S.h=setTimeout(function(){findUsers($(\'q\').value)},300)"><div class="chips">'+[['','همه'],['banned','مسدودها'],['trial','تست گرفته‌ها']].map(function(f){return'<button class="'+(S.f==f[0]?'p':'')+'" onclick="S.f=\''+f[0]+'\';findUsers($(\'q\').value);draw()">'+f[1]+'</button>'}).join('')+'</div></div><div id="ul"></div>'}
function findUsers(q){api('users',{q:q,f:S.f}).then(function(r){S.users=r.users;var e=$('ul');if(e)e.innerHTML=r.users.length?r.users.map(function(u,i){return'<div class="gc row" onclick="openUser(\''+u.id+'\')"><div class="av">'+esc((u.name||'?').slice(0,1))+'</div><div class="m"><b>'+esc(u.name||'—')+(u.username?' <span style="color:var(--s)">@'+esc(u.username)+'</span>':'')+(u.admin?'<span class="pill">ادمین</span>':'')+(u.banned?'<span class="pill r">مسدود</span>':'')+'</b><small>'+u.id+' · '+u.configs+' سرویس · '+u.trials+' تست</small></div><i class="ti ti-chevron-left" style="color:var(--s)"></i></div>'}).join(''):'<div class="gc card" style="color:var(--s)">کاربری پیدا نشد.</div>'})}
function openUser(id){api('user',{id:id}).then(function(r){var u=r.user,h='<div class="gc card"><div class="kv"><span>آیدی</span><b>'+u.id+'</b></div><div class="kv"><span>تست استفاده‌شده</span><b>'+u.trials+' (امتیاز اضافه: +'+u.bonus+')</b></div><div class="kv"><span>آخرین بازدید</span><b>'+String(u.last||'').replace('T',' ').slice(0,16)+'</b></div></div>'+
 '<div class="chips"><button class="'+(u.banned?'p':'dg')+'" onclick="act(\'ban\',{id:\''+u.id+'\'});closeSh()"><i class="ti ti-ban"></i>'+(u.banned?'رفع مسدودی':'مسدود')+'</button><button onclick="act(\'bonus\',{id:\''+u.id+'\',n:1},\'یک تست اضافه شد\')"><i class="ti ti-plus"></i>یک تست دیگر</button><button onclick="act(\'bonus\',{id:\''+u.id+'\',reset:1},\'ریست شد\')"><i class="ti ti-refresh"></i>ریست تست</button><button onclick="grant(\''+u.id+'\')"><i class="ti ti-sparkles"></i>ساخت تست دستی</button><button onclick="dm(\''+u.id+'\')"><i class="ti ti-send"></i>پیام</button></div>'+
 (r.configs.length?'<h2>سرویس‌ها</h2>':'')+r.configs.map(function(c){var p=c.limit?Math.min(100,c.used/c.limit*100):0;return'<div class="gc card"><b><span class="'+(c.active?'on-dot':'off-dot')+'">●</span> '+esc(c.label)+'</b><div class="bar" style="margin:9px 0 5px"><i style="width:'+p+'%"></i></div><div class="kv"><span>'+fb(c.used)+' / '+(c.limit?fb(c.limit):'∞')+'</span><b>'+(c.days==null?'بدون انقضا':c.days+' روز')+'</b></div><div class="chips" style="margin-bottom:0"><button onclick="addCfg(\''+c.id+'\',\''+u.id+'\')"><i class="ti ti-plus"></i>حجم/زمان</button><button onclick="act(\'cfg_toggle\',{uid:\''+c.id+'\'});openUser(\''+u.id+'\')"><i class="ti ti-power"></i>'+(c.active?'غیرفعال':'فعال')+'</button><button class="dg" onclick="if(confirm(\'حذف سرویس؟\')){act(\'cfg_del\',{uid:\''+c.id+'\'},\'حذف شد\').then(function(){openUser(\''+u.id+'\')})}"><i class="ti ti-trash"></i></button></div></div>'}).join('');
 sheet(esc(u.name||'کاربر')+(u.username?' @'+esc(u.username):''),[],null,h)})}
function addCfg(uid,u){sheet('افزایش سرویس',[{k:'gb',l:'حجم اضافه (GB)',t:'number',v:1},{k:'days',l:'روز اضافه',t:'number',v:0},{k:'reset_usage',l:'ریست مصرف',t:'check'}],function(o){act('cfg_add',{uid:uid,gb:o.gb,days:o.days,reset_usage:o.reset_usage},'اعمال شد ✓').then(function(){openUser(u)})})}
function grant(id){var t=S.d.trial;sheet('ساخت تست دستی',[{k:'gb',l:'حجم (GB)',t:'number',v:t.gb},{k:'days',l:'مدت (روز)',t:'number',v:t.days}],function(o){act('grant',{id:id,gb:o.gb,days:o.days},'تست ساخته شد 🎁').then(function(){openUser(id)})})}
function dm(id){sheet('پیام به کاربر',[{k:'text',l:'متن',t:'area'}],function(o){act('msg',{id:id,text:o.text},'ارسال شد ✓')})}
function trial(d){var t=d.trial;return'<div class="gc card"><b>🎁 تنظیمات تست رایگان</b><p style="color:var(--s);font-size:12px;margin:4px 0 8px">وضعیت: <b class="'+(t.enabled?'on-dot':'off-dot')+'">'+(t.enabled?'فعال':'غیرفعال')+'</b> — هر کاربر '+(t.per_user||'نامحدود')+' بار · '+t.gb+' GB / '+t.days+' روز</p><label>حجم سریع</label><div class="chips">'+[0.5,1,2,5,10].map(function(g){return'<button onclick="qk(\'gb\','+g+')">'+g+' GB</button>'}).join('')+'</div><label>مدت سریع</label><div class="chips">'+[1,3,7,15,30].map(function(g){return'<button onclick="qk(\'days\','+g+')">'+g+' روز</button>'}).join('')+'</div><button class="p wide" onclick="editTrial()"><i class="ti ti-adjustments-horizontal"></i>ویرایش کامل</button></div><div class="gc tg"><span><b>تست رایگان فعال</b></span><input type="checkbox" '+(t.enabled?'checked':'')+' onchange="qk(\'enabled\',this.checked)"></div>'}
function qk(k,v){var o=Object.assign({},S.d.trial);o[k]=v;act('trial',o,'اعمال شد ✓')}
function editTrial(){var t=S.d.trial;sheet('تنظیمات تست رایگان',[{k:'enabled',l:'تست رایگان فعال باشد',t:'check',v:t.enabled},{k:'gb',l:'حجم (GB — مثل 0.5)',t:'number',v:t.gb},{k:'days',l:'مدت (روز)',t:'number',v:t.days},{k:'speed_mbps',l:'سرعت (Mbps — 0 = نامحدود)',t:'number',v:t.speed_mbps},{k:'ip_limit',l:'تعداد دستگاه (0 = نامحدود)',t:'number',v:t.ip_limit},{k:'per_user',l:'سقف دفعات هر کاربر (0 = نامحدود)',t:'number',v:t.per_user},{k:'channel',l:'کانال اجباری (مثل @mychannel — ربات باید ادمین کانال باشد)',v:t.channel}],function(o){act('trial',o)})}
function btns(d){var T={url:'لینک',webapp:'مینی‌اپ',text:'پیام'},P={both:'ربات+اپ',bot:'فقط ربات',app:'فقط اپ'};return'<button class="p wide" style="margin-bottom:10px" onclick="editBtn()"><i class="ti ti-plus"></i>دکمه‌ی جدید</button>'+d.buttons.map(function(b,i){return'<div class="gc row"><div class="m"><b class="'+(b.enabled?'':'off-dot')+'">'+esc(b.text)+'</b><small>'+T[b.type]+' · '+P[b.place||'both']+' · '+esc(b.value).slice(0,30)+'</small></div><div class="ic"><button onclick="act(\'btn_move\',{id:\''+b.id+'\',dir:\'up\'},\'جابه‌جا شد\')"><i class="ti ti-arrow-up"></i></button><button onclick="act(\'btn_move\',{id:\''+b.id+'\',dir:\'down\'},\'جابه‌جا شد\')"><i class="ti ti-arrow-down"></i></button><button onclick="editBtn('+i+')"><i class="ti ti-edit"></i></button><button class="dg" onclick="if(confirm(\'حذف؟\'))act(\'btn_del\',{id:\''+b.id+'\'},\'حذف شد\')"><i class="ti ti-trash"></i></button></div></div>'}).join('')||'<div class="gc card" style="color:var(--s)">هنوز دکمه‌ای اضافه نکردی.</div>'}
function editBtn(i){var b=i==null?{type:'url',enabled:true,place:'both'}:S.d.buttons[i];sheet(i==null?'دکمه‌ی جدید':'ویرایش دکمه',[{k:'text',l:'متن دکمه',v:b.text},{k:'type',l:'نوع',t:'select',v:b.type,o:[['url','لینک (https)'],['webapp','مینی‌اپ (https)'],['text','پیام متنی (فقط ربات)']]},{k:'place',l:'محل نمایش',t:'select',v:b.place||'both',o:[['both','ربات و مینی‌اپ'],['bot','فقط ربات'],['app','فقط مینی‌اپ']]},{k:'value',l:'آدرس یا متن پیام',t:'area',v:b.value},{k:'enabled',l:'فعال باشد',t:'check',v:b.enabled}],function(o){o.id=b.id;o.order=b.order;act('btn_save',o)})}
var PRE=[['#9b5cff','#37d6ff'],['#ff5c8a','#ffb347'],['#22c58b','#37d6ff'],['#4d7cff','#9b5cff'],['#f5a524','#f24955'],['#00e0b8','#7cf29a'],['#ff4fd8','#6d5bff']];
function look(d){var t=d.theme;return'<div class="gc card"><b>🎨 رنگ‌بندی مینی‌اپ‌ها</b><label>پالت آماده</label><div class="sw">'+PRE.map(function(p,i){return'<i onclick="pre('+i+')" style="background:linear-gradient(135deg,'+p[0]+','+p[1]+')"></i>'}).join('')+'</div><div class="cr"><div><label>رنگ اصلی</label><input type="color" id="c1" value="'+t.accent+'" oninput="prev()"></div><div><label>رنگ دوم</label><input type="color" id="c2" value="'+t.accent2+'" oninput="prev()"></div></div>'+
 '<label>حالت</label><div class="seg" id="md">'+[['dark','تیره'],['amoled','آمولد'],['light','روشن']].map(function(m){return'<button class="'+(t.mode==m[0]?'on':'')+'" data-m="'+m[0]+'" onclick="setMode(\''+m[0]+'\')">'+m[1]+'</button>'}).join('')+'</div>'+
 '<label>شدت شیشه‌ای (بلور)</label><input type="range" id="gl" min="0" max="100" value="'+t.glass+'" oninput="prev()"><label>گردی گوشه‌ها</label><input type="range" id="rd" min="8" max="30" value="'+t.radius+'" oninput="prev()">'+
 '<button class="p wide" style="margin-top:14px" onclick="saveTheme()"><i class="ti ti-device-floppy"></i>ذخیره و اعمال روی مینی‌اپ مشتری</button></div><div class="gc card"><div class="row" style="padding:0;margin:0;border:0;background:none;box-shadow:none"><div class="logo"><svg class="vm" viewBox="0 0 64 64"><rect x="2" y="2" width="60" height="60" rx="18" fill="url(#vwg)"/><circle class="orb" cx="32" cy="32" r="25" fill="none" stroke="#fff" stroke-opacity=".4" stroke-width="1.4" stroke-dasharray="3 7" stroke-linecap="round"/><path d="M17 19 32 46 47 19" fill="none" stroke="#fff" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M24 52q8 5 16 0" fill="none" stroke="#fff" stroke-opacity=".7" stroke-width="2.6" stroke-linecap="round"/><circle class="nd" cx="32" cy="46" r="3.6" fill="#fff"/><circle cx="47" cy="15" r="2" fill="#fff"/></svg></div><div class="m"><b>پیش‌نمایش زنده</b><small>همین صفحه همزمان تغییر می‌کند</small></div><button class="p">دکمه</button></div></div>'}
function cur(){var m=document.querySelector('#md .on');return{accent:$('c1').value,accent2:$('c2').value,mode:m?m.dataset.m:'dark',glass:+$('gl').value,radius:+$('rd').value}}
function prev(){applyTheme(cur())}
function pre(i){$('c1').value=PRE[i][0];$('c2').value=PRE[i][1];prev()}
function setMode(m){document.querySelectorAll('#md button').forEach(function(b){b.classList.toggle('on',b.dataset.m==m)});prev()}
function saveTheme(){act('theme',cur(),'ظاهر ذخیره شد 🎨')}
function texts(d){var x=d.texts;return'<div class="gc card"><label>نام برند</label><input id="x0" value="'+esc(d.brand)+'"><label>پیام خوش‌آمد ربات (/start)</label><textarea id="x1">'+esc(x.welcome)+'</textarea><label>پیام فعال‌سازی تست</label><textarea id="x2">'+esc(x.trial_ok)+'</textarea><label>اعلان بالای مینی‌اپ (با کلید داشبورد روشن می‌شود)</label><textarea id="x3">'+esc(x.announce)+'</textarea><label>راهنمای اتصال (هر خط یک مرحله)</label><textarea id="x4">'+esc(x.guide)+'</textarea><button class="p wide" style="margin-top:12px" onclick="act(\'texts\',{brand:$(\'x0\').value,welcome:$(\'x1\').value,trial_ok:$(\'x2\').value,announce:$(\'x3\').value,guide:$(\'x4\').value})">ذخیره</button></div>'}

function addAdmin(){sheet('افزودن ادمین',[{k:'id',l:'آیدی عددی تلگرام',t:'number'}],function(o){act('admin_add',{id:o.id},'ادمین اضافه شد ✓')})}
