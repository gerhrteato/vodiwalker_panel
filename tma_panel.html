if(S.tab=='h'){h='<div class="card hero"><div class="hlg"><svg class="vm" viewBox="0 0 64 64"><rect x="2" y="2" width="60" height="60" rx="18" fill="url(#vwg)"/><circle class="orb" cx="32" cy="32" r="25" fill="none" stroke="#fff" stroke-opacity=".4" stroke-width="1.4" stroke-dasharray="3 7" stroke-linecap="round"/><path d="M17 19 32 46 47 19" fill="none" stroke="#fff" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M24 52q8 5 16 0" fill="none" stroke="#fff" stroke-opacity=".7" stroke-width="2.6" stroke-linecap="round"/><circle class="nd" cx="32" cy="46" r="3.6" fill="#fff"/><circle cx="47" cy="15" r="2" fill="#fff"/></svg></div><div class="hx"><small>مجموع کل ترافیک</small><b>'+fb(D.traffic)+'</b><small><span class="bg gr"><i class="pd"></i>'+D.online+' آنلاین</span></small></div><div class="wv"><svg viewBox="0 0 400 34" preserveAspectRatio="none"><path d="M0 17Q25 0 50 17T100 17T150 17T200 17T250 17T300 17T350 17T400 17V34H0Z" fill="url(#vwg)" fill-opacity=".35"/><path d="M0 17Q25 0 50 17T100 17T150 17T200 17T250 17T300 17T350 17T400 17" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="1.4"/></svg></div></div><div class="sg">'+sc('ti-network','#9b5cff',D.total,'کل اینباندها')+sc('ti-circle-check','#22c58b',D.active,'فعال')+sc('ti-clock-exclamation','#f5a524',D.near,'نزدیک انقضا')+sc('ti-folders','#37d6ff',S.G.length,'گروه ساب')+'</div><h2><i class="ti ti-bolt"></i> ساخت سریع (واقعی)</h2><div class="q6">'+[[10,30],[30,30],[50,30],[100,30],[200,60],[0,30]].map(function(p){return'<button class="pr" onclick="qc('+p[0]+','+p[1]+')">'+(p[0]?p[0]+' گیگ':'♾ نامحدود')+' · '+p[1]+' روز</button>'}).join('')+'</div><h2><i class="ti ti-adjustments"></i> ساخت دلخواه</h2><div class="card"><input id="cn" placeholder="اسم (Vodiwalker → Vodiwalker|Tofan🚀)"><div class="rw"><input id="cg" type="number" placeholder="حجم GB (0=∞)"><input id="cd" type="number" placeholder="روز (0=∞)"></div><button class="pr" style="width:100%" onclick="qc(+$(\'cg\').value||0,+$(\'cd\').value||0,$(\'cn\').value)"><i class="ti ti-plus"></i> ساخت اینباند</button></div><button style="width:100%" onclick="adv()"><i class="ti ti-adjustments"></i> ساخت پیشرفته (پروتکل، پورت، محدودیت IP و اتصال)</button>'}
else if(S.tab=='c'){var F=[['all','همه'],['on','فعال'],['net','آنلاین'],['near','نزدیک انقضا'],['off','غیرفعال']];h='<div class="fl">'+F.map(function(x){return'<button class="ch '+(S.f==x[0]?'on':'')+'" onclick="S.f=\''+x[0]+'\';draw()">'+x[1]+'</button>'}).join('')+'</div>'+(S.L.filter(fl).map(li).join('')||'<div class="em">موردی نیست</div>')}

function op(id){var l=S.L.filter(function(x){return x.id==id})[0];if(!l)return;var s=st(l);sheet('<div class="hd"><div class="av '+s[0]+'"><i class="ti ti-router"></i></div><b style="font-size:14px;direction:ltr;text-align:right">'+e(l.label)+'</b><span class="bg '+s[2]+'">'+s[1]+'</span></div><div class="u">'+e(l.link||'—')+'</div><img class="q" src="'+qr(l.link||'')+'"><div class="rw"><button class="pr" onclick="cp(\''+e(l.link)+'\')"><i class="ti ti-copy"></i> کپی لینک</button><button onclick="cp(\''+e(l.sub)+'\')"><i class="ti ti-link"></i> کپی ساب</button></div><h2><i class="ti ti-pencil"></i> ویرایش سریع</h2><div class="q6"><button onclick="ed(\''+id+'\',\'gb\',10)">+10 GB</button><button onclick="ed(\''+id+'\',\'gb\',50)">+50 GB</button><button onclick="ed(\''+id+'\',\'d\',30)">+30 روز</button><button onclick="ed(\''+id+'\',\'d\',90)">+90 روز</button><button onclick="ed(\''+id+'\',\'reset\')"><i class="ti ti-refresh"></i> ریست مصرف</button><button onclick="ed(\''+id+'\',\'rname\')"><i class="ti ti-dice-5"></i> اسم خفن</button><button onclick="ed(\''+id+'\',\'toggle\')">'+(l.active?'⏸ غیرفعال':'▶ فعال')+'</button><button class="dg" onclick="if(confirm(\'حذف شود؟\'))ed(\''+id+'\',\'del\')"><i class="ti ti-trash"></i> حذف</button></div>'+cl(l))}
